# The local gates, run on a clean public checkout.
#
# A runner has none of the ignored private directories (config/, evidence/, build/,
# dist/, logs/, runs/), no game asset, no installed build and no device.  Tests that
# need one of those skip with a reason naming what is missing; everything else must
# pass.  Game assets are never fetched here: the job proves that their absence is
# reported, not that the recognisers work.
#
# This job reads the repository and nothing else: no secrets, no write permission and
# no artifact upload, so a log, a frame or a package can never leave the runner as a
# download.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the project with its dev extras, at the locked versions
        run: python -m pip install -c requirements-lock.txt -e '.[dev]'

      - name: Wiki guard
        run: python tools/check_wiki.py

      - name: Tracked files are publishable
        run: python tools/check_public_tree.py

      # Exit status 2 is the pass here: a checkout without game assets must say so.
      - name: Missing game assets are reported
        shell: pwsh
        run: |
          python tools/check_local_assets.py
          if ($LASTEXITCODE -ne 2) { throw "expected exit status 2 on a checkout without game assets, got $LASTEXITCODE" }
          exit 0

      # tools/run_tests.py exits with pytest's own status; never pipe it.
      - name: Test suite
        run: python tools/run_tests.py -q

      - name: Build the Python packages
        run: python -m build --outdir build/python-package

      - name: Built packages carry nothing private
        shell: pwsh
        run: |
          Get-ChildItem build/python-package -File | ForEach-Object {
            python tools/check_public_tree.py --archive $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "package check failed for $($_.Name)" }
          }
